<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" coAntent="width=device-width, initial-scale=1.0" />
    <title>Admin Profil - Ny.Djo Bakery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container-fluid min-vh-100">
      <div class="row h-100">
        <!-- Sidebar -->
        <div class="col-12 col-md-3 col-lg-2 sidebar d-flex flex-column justify-content-between">
          <div>
            <div class="logo text-center mb-4">
              <img src="image/logo.png" alt="NYDIO Bakery Logo" class="img-fluid" />
            </div>
            <div class="px-3">
              <a href="Kasir Transaksi Baru.html">Transaksi Baru</a>
              <a href="Kasir Online Payment.html">Online Payment</a>
              <a href="Kasir Riwayat Transaksi.html">Riwayat Transaksi</a>
            </div>
          </div>
          <div class="px-3">
            <a href="Kasir Profil.html" class="text-danger">Logout</a>
          </div>
        </div>

        <!-- Konten utama -->
        <div class="col d-flex flex-column">
          <div class="main-title">Transaksi Baru </div>
          <div class = "content">
            <div class = "order-summary">
              <table>
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Harga</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody id="order-list">
                </tbody>
              </table>
              <div class="total">
                <span>Total Bayar</span>
                <span id="total-bayar">Rp 0</span>
              </div>
              <div class="buttons">
                <button>Tunai</button>
                <button>Qris</button>
                <button>Cancel Order</button>
              </div>
              <button class="confirm-btn">Confirm</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
